[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webgap"
version = "0.1.0"
description = "Web Graph-Anchored attention Plugin for frozen multimodal LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "WebGAP authors"}]
dependencies = [
  "torch>=2.5",
  "transformers>=4.57",
  "peft",
  "accelerate",
  "datasets",
  "pillow",
  "pyyaml",
  "tqdm",
  "matplotlib",
  "seaborn",
  "pandas",
  "numpy",
  "qwen-vl-utils",
]

[tool.setuptools.packages.find]
where = ["src"]
